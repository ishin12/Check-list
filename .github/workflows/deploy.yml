name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/elegant-lovelace-I02rh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Live Ghsoon Najd Supabase project. The publishable (anon) key is
          # public by design — RLS protects the data, not key secrecy.
          VITE_DEMO_MODE: '0'
          VITE_SUPABASE_URL: https://qyznhoimffltdigickjl.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_8GlzwxVm3OTezLF18jmWyQ_UtI924W4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
